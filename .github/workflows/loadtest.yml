name: Load Test

on:
  workflow_dispatch:  

jobs:
  k6-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup k6
        uses: grafana/setup-k6-action@v1
      - name: Run k6 smoke test
        uses: grafana/run-k6-action@v1
        with:
          path: |
            loadtest/script.js